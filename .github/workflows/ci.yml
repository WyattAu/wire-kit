# wire-kit CI — the estate gate matrix.
#
# quality: shared Tier A workflow (pedantic surface, coverage >= 90,
# miri over the encode/decode suites, thumbv7em gate for the claimed
# #![no_std]). Loom is n/a: no shared-memory concurrency primitives.
# The `simd`-gated code is assessed per-config; see COVERAGE-NOTES.md.
#
# fuzz-smoke: bounded smoke fuzz (30 s per target, fleet §4) over the
# committed seeded corpora. Deep runs are manual/off-peak.
#
# bench-smoke: criterion sanity only, not a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@589f761d0a33074b3d936b8bc78945227ab88aa # main @ 2026-10-03
    with:
      tier: a
      all-features: true
      miri: true
      embedded: true

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: fuzz smoke — find_soh (30 s, fleet §4)
        run: cargo fuzz run find_soh -- -max_total_time=30
      - name: fuzz smoke — sbe_decode (30 s, fleet §4)
        run: cargo fuzz run sbe_decode -- -max_total_time=30
      - name: fuzz smoke — fix_parse (30 s, fleet §4)
        run: cargo fuzz run fix_parse -- -max_total_time=30

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Criterion smoke (sanity, not a gate)
        run: cargo bench -- --test
