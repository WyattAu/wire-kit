name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@30e56e97d87ea0de0c2f7c81d1458b52c51e5a4a # bisect: fresh untried SHA
    with:
      tier: a
      all-features: true
      miri: true
      embedded: true
