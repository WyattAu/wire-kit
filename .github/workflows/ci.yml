name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@701c2e5c2950ce67b3848f826144578c3f82f430 # main @ 2026-10-03
    with:
      tier: a
      all-features: true
      miri: true
      embedded: true
