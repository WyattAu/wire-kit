name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@701c2e5c2950ce67b3848f826144578c3f82f430 # main @ 2026-10-03
    with:
      tier: a
      all-features: true
      miri: true
      embedded: true

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: fuzz smoke — find_soh (30 s, fleet §4)
        run: cargo fuzz run find_soh -- -max_total_time=30
      - name: fuzz smoke — sbe_decode (30 s, fleet §4)
        run: cargo fuzz run sbe_decode -- -max_total_time=30
      - name: fuzz smoke — fix_parse (30 s, fleet §4)
        run: cargo fuzz run fix_parse -- -max_total_time=30

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Criterion smoke (sanity, not a gate)
        run: cargo bench -- --test
